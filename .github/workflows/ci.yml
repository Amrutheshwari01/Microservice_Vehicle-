
name: Vehicle Microservice CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q backend/

      - name: Run automated tests
        run: python -m pytest backend/tests -v --tb=short

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agrilink-vehicle:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to AWS EC2 via SSH
        if: "${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to AWS EC2 (${{ secrets.EC2_HOST }})"
            cd ~/Microservice_Vehicle-
            echo "Pulling latest code from origin main..."
            git pull origin main
            echo "Restarting AgriLink RTO Microservice..."
            sudo systemctl restart agrilink-rto.service
            sudo systemctl status agrilink-rto.service --no-pager
            echo "Checking application health..."
            curl -s http://localhost:8000/v1/vehicles | head -c 100
            echo "AWS DEPLOYMENT SUCCESSFUL"

      - name: Verify Live Deployment Status
        run: |
          echo "========================================================"
          echo "AWS EC2 Deployment Target: http://65.2.161.125:8000/"
          echo "Service: agrilink-rto.service (Ubuntu 24.04 LTS)"
          echo "Interactive Swagger Docs: http://65.2.161.125:8000/docs"
          echo "Shared Cloud DB: Supabase PostgreSQL (mgilglfzakfqmssxadrx)"
          echo "Status: DEPLOYED & ACTIVE"
          echo "========================================================"
